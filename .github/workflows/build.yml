name: Build Evolution Mod

on:
  push:
    branches: [ '**' ]
    paths-ignore: [ 'releases/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref_name != 'ci-logs' && github.ref_name != 'mc-src'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build mod
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Server self-test (real Forge server + built jar)
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          FORGE=1.21.1-52.0.7
          mkdir -p srv && cd srv
          curl -sSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE}/forge-${FORGE}-installer.jar"
          java -jar installer.jar --installServer . > installer.log 2>&1 || (tail -30 installer.log; exit 1)
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-seed=evolution\n' > server.properties
          mkdir -p mods && cp "../build/libs/evolutionmod-${VERSION}.jar" mods/
          echo "-Devolutionmod.selftest=true" >> user_jvm_args.txt
          chmod +x run.sh
          set +e
          timeout 600 ./run.sh nogui < /dev/null > ../selftest.log 2>&1
          echo "exit code: $?"
          set -e
          cd ..
          grep -E "\[SELFTEST\]|Exception|ERROR|evolutionmod" selftest.log | head -300 > selftest-summary.log || true
          cat selftest-summary.log
          grep -q "\[SELFTEST\] RESULT: OK" selftest.log

      - name: Client visual test (screenshots of every GUI)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          mkdir -p run/saves
          rm -rf run/saves/selftest && cp -r srv/world run/saves/selftest
          rm -f run/saves/selftest/session.lock
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\nsoundCategory_master:0.0\nnarrator:0\nguiScale:3\n' > run/options.txt
          set +e
          EVO_CLIENTTEST=true LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 900 ./gradlew runClient --no-daemon > clienttest.log 2>&1
          echo "exit code: $?"
          set -e
          grep -E "CLIENTTEST|Exception|ERROR" clienttest.log | head -200 || true
          ls -la run/screenshots || true

      - name: Publish build log to the ci-logs branch
        if: always()
        run: |
          NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '_')
          mkdir -p /tmp/logs
          cp build.log "/tmp/logs/${NAME}.log" 2>/dev/null || echo "no log" > "/tmp/logs/${NAME}.log"
          cp selftest.log "/tmp/logs/${NAME}.selftest.log" 2>/dev/null || true
          cp selftest-summary.log "/tmp/logs/${NAME}.selftest-summary.log" 2>/dev/null || true
          cp clienttest.log "/tmp/logs/${NAME}.clienttest.log" 2>/dev/null || true
          mkdir -p /tmp/logs/screenshots && cp run/screenshots/*.png /tmp/logs/screenshots/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > "/tmp/logs/${NAME}.status"
          ls -l build/libs >> "/tmp/logs/${NAME}.status" 2>/dev/null || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A && git commit -qm "build log ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: evolutionmod-jar
          path: build/libs/evolutionmod-*.jar
          if-no-files-found: error

      - name: Publish release and commit the jar (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          JAR="build/libs/evolutionmod-${VERSION}.jar"
          ls -l "$JAR"
          # 1) Release GitHub (créée ou mise à jour)
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$JAR" --clobber
          else
            gh release create "v${VERSION}" "$JAR" --title "Evolution Mod ${VERSION}" \
              --notes-file CHANGELOG.md --target "${GITHUB_SHA}"
          fi
          # 2) Copie du jar dans le dépôt (dossier releases/)
          mkdir -p releases
          cp "$JAR" releases/
          cp "$JAR" releases/evolutionmod-latest.jar
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add releases/
          if ! git diff --cached --quiet; then
            git commit -qm "Jar compilé ${VERSION} (${GITHUB_SHA::7})"
            git push -q origin HEAD:main
          fi
