name: Build Evolution Mod

on:
  push:
    branches: [ '**' ]
    paths-ignore: [ 'releases/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref_name != 'ci-logs' && github.ref_name != 'mc-src'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build mod
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Self-test (real Forge server + real client with screenshots)
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          JAR="$PWD/build/libs/evolutionmod-${VERSION}.jar"
          FORGE=1.21.1-52.0.7
          # ---- Serveur ----
          mkdir -p srv && cd srv
          curl -sSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE}/forge-${FORGE}-installer.jar"
          java -jar installer.jar --installServer . > installer.log 2>&1 || (tail -30 installer.log; exit 1)
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nspawn-protection=0\nlevel-seed=evolution\ngamemode=creative\n' > server.properties
          mkdir -p mods && cp "$JAR" mods/
          printf -- '-Devolutionmod.selftest=true\n-Devolutionmod.selftest.keep=true\n' >> user_jvm_args.txt
          chmod +x run.sh
          (timeout 1500 ./run.sh nogui < /dev/null > ../selftest.log 2>&1; echo "server exit $?" >> ../selftest.log) &
          cd ..
          for i in $(seq 1 120); do grep -q "SELFTEST\] RESULT" selftest.log && break; sleep 5; done
          grep -E "\[SELFTEST\]|Exception|ERROR" selftest.log | head -300 > selftest-summary.log || true
          cat selftest-summary.log
          # ---- Client (portablemc + Xvfb, rendu logiciel) — hors main, pour garder la release rapide ----
          set +e
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          pip install -q portablemc
          mkdir -p client/mods && cp "$JAR" client/mods/
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\nsoundCategory_master:0.0\nnarrator:0\nguiScale:3\nskipMultiplayerWarning:true\njoinedFirstServer:true\n' > client/options.txt
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" timeout 900 \
            portablemc --main-dir "$PWD/mcmain" --work-dir "$PWD/client" start "forge:${FORGE}" \
            -u Tester -s 127.0.0.1 --resolution 1280x720 \
            --jvm-args="-Xmx3G -Devolutionmod.clienttest=true" > clienttest.log 2>&1
          echo "client exit $?"
          grep -E "CLIENTTEST|Exception|ERROR" clienttest.log | head -100
          ls -la client/screenshots
          fi
          pkill -f "nogui" || true
          wait
          set -e
          grep -q "\[SELFTEST\] RESULT: OK" selftest.log

      - name: Publish build log to the ci-logs branch
        if: always()
        run: |
          NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '_')
          mkdir -p /tmp/logs
          cp build.log "/tmp/logs/${NAME}.log" 2>/dev/null || echo "no log" > "/tmp/logs/${NAME}.log"
          cp selftest.log "/tmp/logs/${NAME}.selftest.log" 2>/dev/null || true
          cp selftest-summary.log "/tmp/logs/${NAME}.selftest-summary.log" 2>/dev/null || true
          cp clienttest.log "/tmp/logs/${NAME}.clienttest.log" 2>/dev/null || true
          mkdir -p /tmp/logs/screenshots && cp client/screenshots/*.png /tmp/logs/screenshots/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > "/tmp/logs/${NAME}.status"
          ls -l build/libs >> "/tmp/logs/${NAME}.status" 2>/dev/null || true
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A && git commit -qm "build log ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: evolutionmod-jar
          path: build/libs/evolutionmod-*.jar
          if-no-files-found: error

      - name: Publish release and commit the jar (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          JAR="build/libs/evolutionmod-${VERSION}.jar"
          ls -l "$JAR"
          # 1) Release GitHub (créée ou mise à jour)
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$JAR" --clobber
          else
            gh release create "v${VERSION}" "$JAR" --title "Evolution Mod ${VERSION}" \
              --notes-file CHANGELOG.md --target "${GITHUB_SHA}"
          fi
          # 2) Copie du jar dans le dépôt (dossier releases/)
          mkdir -p releases
          cp "$JAR" releases/
          cp "$JAR" releases/evolutionmod-latest.jar
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add releases/
          if ! git diff --cached --quiet; then
            git commit -qm "Jar compilé ${VERSION} (${GITHUB_SHA::7})"
            git push -q origin HEAD:main
          fi
