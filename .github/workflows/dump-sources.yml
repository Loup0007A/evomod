name: Dump MC sources (temp)
on:
  push:
    branches: [ sources-dump ]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew && ./gradlew compileJava --no-daemon || true
      - run: |
          find ~/.gradle/caches/forge_gradle -name '*.jar' -size +1M -exec ls -la {} \;
          mkdir out
          find ~/.gradle/caches/forge_gradle -name '*sources*.jar' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: mc-sources
          path: out/
