name: Dump MC sources (temp)
on:
  push:
    branches: [ sources-dump ]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew && ./gradlew compileJava --no-daemon || true
      - name: Extract sources
        run: |
          mkdir -p /tmp/src
          find ~/.gradle/caches -name '*.jar' -size +500k -printf '%s %p\n' | sort -n > /tmp/src/jars.txt
          SRC=$(find ~/.gradle/caches/forge_gradle -name 'forge-1.21.1-52.0.7*sources*.jar' -size +5M | head -1)
          echo "sources: $SRC" >> /tmp/src/jars.txt
          if [ -n "$SRC" ]; then
            cd /tmp/src && unzip -q -o "$SRC" 'net/minecraft/*' 'net/minecraftforge/*' 'com/mojang/*' -d /tmp/src/java || true
          else
            BIN=$(find ~/.gradle/caches/forge_gradle -name 'forge-1.21.1-52.0.7_mapped*.jar' ! -name '*sources*' -size +5M | head -1)
            echo "binary: $BIN" >> /tmp/src/jars.txt
            curl -sSL -o /tmp/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.10.1/vineflower-1.10.1.jar
            mkdir -p /tmp/src/java
            java -jar /tmp/vf.jar -only=net/minecraft -only=net/minecraftforge -only=com/mojang "$BIN" /tmp/src/java > /tmp/vf.log 2>&1 || true
            tail -5 /tmp/vf.log >> /tmp/src/jars.txt
            # vineflower writes a zip/jar if input is a jar
            for z in /tmp/src/java/*.jar; do [ -f "$z" ] && (cd /tmp/src/java && unzip -q -o "$z" && rm "$z"); done
          fi
          du -sh /tmp/src >> /tmp/src/jars.txt
      - name: Push to branch
        run: |
          cd /tmp/src
          git init -q -b mc-src
          git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm sources
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mc-src
