name: Dump MC libs (temp)
on:
  push:
    branches: [ sources-dump ]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Collect compile classpath
        run: |
          chmod +x gradlew
          cat >> build.gradle <<'G'

          tasks.register('dumpCp') {
              doLast {
                  def out = file('/tmp/libs')
                  out.mkdirs()
                  configurations.compileClasspath.resolve().each { f ->
                      if (f.isFile()) { ant.copy(file: f, todir: out) }
                  }
              }
          }
          G
          ./gradlew dumpCp --no-daemon
          ls -la /tmp/libs | head -100
          du -sh /tmp/libs
          cd /tmp/libs
          # GitHub refuse les fichiers > 100 Mo
          find . -size +95M -print -delete
          git init -q -b mc-libs
          git config user.email ci@example.com && git config user.name ci
          git add -A && git commit -qm libs
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" mc-libs
