plugins {
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = project.mod_version
group = 'com.evolutionmod'
archivesBaseName = 'evolutionmod'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'parchment', version: '2024.11.17-1.21.1'
    reobf = false

    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            if (System.getenv('EVO_CLIENTTEST')) {
                property 'evolutionmod.clienttest', 'true'
                args '--quickPlaySingleplayer', 'selftest', '--width', '1280', '--height', '720'
            }
            mods {
                evolutionmod {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'evolutionmod.selftest', System.getenv('EVO_SELFTEST') ?: 'false'
            args '--nogui'
            mods {
                evolutionmod {
                    source sourceSets.main
                }
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '1000'
}

repositories {
    maven { url = 'https://maven.parchmentmc.org' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.21.1-52.0.7"
}

jar {
    manifest {
        attributes([
            "Specification-Title": "evolutionmod",
            "Specification-Vendor": "evolutionmod",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor": "evolutionmod",
        ])
    }
}

// Classes et ressources dans un même dossier : nécessaire au système de modules Java en dev (runClient/runServer).
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
